syntax = "proto3";

package raft.v1;

option go_package = "raft-kv/pkg/proto;raftpb";

// LogEntry represents an individual recorded action.
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

// RequestVoteArgs is sent by candidates asking for votes.
message RequestVoteArgs {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

// RequestVoteReply is sent back by voters.
message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

// AppendEntriesArgs is used for heartbeats and log replication.
message AppendEntriesArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

// AppendEntriesReply is the follower response to replication/heartbeat.
message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_term = 3;
  uint64 conflict_index = 4;
}

// InstallSnapshotArgs is sent when a follower is too far behind.
message InstallSnapshotArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

// InstallSnapshotReply confirms receipt of a snapshot.
message InstallSnapshotReply {
  uint64 term = 1;
}

service RaftService {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotArgs) returns (InstallSnapshotReply);
}
